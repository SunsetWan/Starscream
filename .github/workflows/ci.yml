name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift Package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Run Swift Package tests
        run: swift test --parallel -Xswiftc -warnings-as-errors

  ios:
    name: iOS framework and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the iOS framework
        run: |
          xcodebuild build \
            -project Starscream.xcodeproj \
            -scheme Starscream \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator was found" >&2
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run iOS unit tests
        run: |
          xcodebuild test \
            -project Starscream.xcodeproj \
            -scheme Starscream \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO
